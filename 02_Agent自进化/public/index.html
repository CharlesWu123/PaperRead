<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Skill 自进化论文阅读器</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div>
          <h1>Agent Skill 自进化</h1>
          <p id="summaryText">论文阅读器</p>
        </div>
      </div>
      <div class="controls">
        <label class="field-label" for="searchInput">搜索</label>
        <input id="searchInput" class="search" type="search" placeholder="标题、标签、作者">
        <label class="field-label" for="categorySelect">分类</label>
        <select id="categorySelect" class="select">
          <option value="all">全部分类</option>
        </select>
      </div>
      <nav id="paperList" class="paper-list" aria-label="论文列表"></nav>
    </aside>

    <main class="reader">
      <section class="reader-header">
        <div>
          <p id="paperMeta" class="eyebrow">选择一篇论文开始阅读</p>
          <h2 id="paperTitle">Agent Skill 自进化论文报告</h2>
          <p id="paperWhy" class="subtitle">左侧列表按推荐阅读顺序排列。</p>
        </div>
        <div id="linkBar" class="link-bar"></div>
      </section>

      <section class="stats-row" id="statsRow"></section>
      <article id="reportContent" class="report-content"></article>
    </main>
  </div>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });</script>
  <script defer src="/app.js"></script>
</body>
</html>
